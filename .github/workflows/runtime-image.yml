name: Runtime Image Release

on:
  pull_request:
    branches: ["main"]
  push:
    tags:
      - "runtime-v*.*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from for manual release or rollback"
        required: false
        default: main
      version:
        description: "Runtime image version, e.g. runtime-v1.3.2"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Determine image tag
        id: meta
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$REQUESTED_VERSION" ]; then
            IMAGE_TAG="$REQUESTED_VERSION"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="runtime-${GITHUB_SHA::12}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: go run ./cmd/plugin-sync
      - run: go test ./...
      - name: Build runtime and static images
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --build-arg FOUNDRY_BUILD_VERSION="ci-${GITHUB_SHA}" \
            --build-arg FOUNDRY_BUILD_COMMIT="${GITHUB_SHA}" \
            --build-arg FOUNDRY_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t foundry-runtime:ci \
            --load \
            .
          docker buildx build \
            --platform linux/amd64 \
            --target static \
            --build-arg FOUNDRY_BUILD_VERSION="ci-${GITHUB_SHA}" \
            --build-arg FOUNDRY_BUILD_COMMIT="${GITHUB_SHA}" \
            --build-arg FOUNDRY_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t foundry-static-runtime:ci \
            --load \
            .
      - name: Verify runtime image is non-root
        run: test "$(docker run --rm --entrypoint id foundry-runtime:ci -u)" != "0"
      - name: Smoke test static image with a bind-mounted site
        shell: bash
        run: |
          set -eu
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT

          mkdir -p "$smoke_dir/content/config" "$smoke_dir/content/pages" "$smoke_dir/content/posts" "$smoke_dir/themes" "$smoke_dir/data" "$smoke_dir/plugins"
          cp -R themes/default "$smoke_dir/themes/default"
          cat <<'EOF' | sed 's/^          //' > "$smoke_dir/content/config/site.yaml"
          name: smoke-test
          title: Foundry Docker Smoke Test
          theme: default
          default_lang: en
          content_dir: content
          public_dir: public
          themes_dir: themes
          data_dir: data
          plugins_dir: plugins
          EOF
          cat <<'EOF' | sed 's/^          //' > "$smoke_dir/content/pages/index.md"
          ---
          title: Smoke Test
          ---

          # Foundry Docker Smoke Test
          EOF

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${smoke_dir},dst=/repo" \
            --workdir /repo \
            foundry-static-runtime:ci \
            foundry build
          test -s "$smoke_dir/public/index.html"

  publish:
    runs-on: ubuntu-latest
    needs: [test, resolve]
    if: github.event_name != 'pull_request'
    concurrency:
      group: runtime-image-${{ needs.resolve.outputs.image_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime image
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -eu
          IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          assert_tag_available() {
            local image="$1" output
            output="$(mktemp)"
            if docker buildx imagetools inspect "$image" >"$output" 2>&1; then
              rm -f "$output"
              echo "::error::Refusing to overwrite existing immutable image tag $1"
              return 1
            fi
            if ! grep -Eqi "not found|manifest unknown|name unknown|does not exist|404" "$output"; then
              cat "$output"
              rm -f "$output"
              echo "::error::Unable to verify whether immutable image tag $image is available"
              return 1
            fi
            rm -f "$output"
          }

          for image in foundry-runtime foundry-static-runtime; do
            IMAGE_URI="${IMAGE_NAMESPACE}/${image}:${IMAGE_TAG}"
            assert_tag_available "${IMAGE_URI}"
          done

          BUILD_MODIFIED=false
          BUILD_STATUS="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$BUILD_STATUS" ]; then
            BUILD_MODIFIED=true
          fi

          for image in foundry-runtime foundry-static-runtime; do
            IMAGE_URI="${IMAGE_NAMESPACE}/${image}:${IMAGE_TAG}"
            LATEST_URI="${IMAGE_NAMESPACE}/${image}:latest"
            target=runtime
            if [ "$image" = "foundry-static-runtime" ]; then
              target=static
            fi

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --target "$target" \
              --build-arg FOUNDRY_BUILD_VERSION="${IMAGE_TAG}" \
              --build-arg FOUNDRY_BUILD_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)" \
              --build-arg FOUNDRY_BUILD_MODIFIED="${BUILD_MODIFIED}" \
              --build-arg FOUNDRY_BUILD_COMMIT="${GITHUB_SHA}" \
              --build-arg FOUNDRY_BUILD_DATE="${BUILD_DATE}" \
              -t "${IMAGE_URI}" \
              -t "${LATEST_URI}" \
              --push \
              .
          done
