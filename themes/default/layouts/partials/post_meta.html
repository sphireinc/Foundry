{{ define "post_meta" }}
<div class="meta-row">
  {{ if .Page.Date }}
  <span class="meta-pill">{{ t .Lang "Published" }} {{ formatDate .Lang .Page.Date }}</span>
  {{ end }} {{ if .Page.UpdatedAt }}
  <span class="meta-pill">{{ t .Lang "Updated" }} {{ formatDate .Lang .Page.UpdatedAt }}</span>
  {{ end }}
  <span class="meta-pill">{{ .Page.Lang }}</span>
</div>
{{ end }}
